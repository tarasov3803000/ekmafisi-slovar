<!DOCTYPE html>
<html lang="ru" translate="no">
<head>
<meta charset="utf-8">

<meta name="theme-color" content="#0f151c" media="(prefers-color-scheme: dark)">

<meta name="mobile-web-app-capable" content="yes">

<script>/* тема и крупный шрифт — до первой отрисовки; кегль общий с Экмафиси (тот же адрес — то же хранилище) */
try {
  const u = localStorage.getItem('ekmafisi-up'); document.documentElement.style.setProperty('--up', (+u || 0) + 'px');
  const t = localStorage.getItem('slovar-theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
} catch (e) {}</script>
<link rel="stylesheet" href="tokeny.css">
<style>
/* «Словарь» — отдельное приложение на общем коде с Экмафиси: вход и хранилище — sync.js, словарь — slovar.js */
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--paper); color: var(--ink); font: calc(16px + var(--up))/1.5 var(--f-ui); -webkit-text-size-adjust: 100%; }
main { max-width: 560px; margin: 0 auto; padding: 16px 16px 48px; display: grid; gap: 16px; }
p { margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
.hidden { display: none !important; }
.muted { color: var(--muted); }
.brand { display: flex; align-items: baseline; gap: 10px; }
.brand b { font: 600 calc(22px + var(--up))/1 var(--f-el); }
.btn { border: 1px solid var(--line); background: var(--card); border-radius: 12px; padding: 12px 16px; font-weight: 600; min-height: 48px; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn:disabled { opacity: .45; cursor: default; }
.gate { min-height: 80vh; align-content: center; text-align: center; justify-items: center; }
.gate p { max-width: 22em; }
.err { color: var(--r); font-size: calc(14px + var(--up)); }
.icon { border: 0; background: none; padding: 8px; margin-right: -8px; color: var(--muted); display: inline-flex; border-radius: 10px; flex: none; }  /* шестерёнка — в строке поиска (Slovar.mount, aside) */
.foot { display: grid; gap: 14px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; font-size: calc(14px + var(--up)); }
.foot .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; justify-content: space-between; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.seg button { border: 0; background: transparent; padding: 8px 12px; min-height: 40px; font-weight: 600; font-variant-numeric: tabular-nums; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.link { background: none; border: 0; padding: 0; color: var(--accent); text-decoration: underline; text-underline-offset: 3px; font-weight: 600; }
</style>
</head>
<body>

<main id="login" class="gate hidden">
  <div class="brand"><b>Словарь</b></div>
  <p class="muted">Греческо-русский, без сети</p>
  <button class="btn primary" id="loginBtn" disabled>Войти через Google</button>
  <p class="err" id="loginErr"></p>
</main>

<main id="gate" class="gate hidden">
  <div class="brand"><b>Словарь</b></div>
  <p id="gateMsg"></p>
  <div class="row" style="display:flex;gap:8px;justify-content:center"><button class="btn" id="gateRetry">Ещё раз</button><button class="btn hidden" id="gateOut">Выйти</button></div>
</main>

<main id="app" class="hidden">
  <button class="icon" id="setOpen" aria-label="Настройки" aria-expanded="false"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
  <section class="foot hidden" id="settings">
    <div class="row"><span>Тема</span><div class="seg" id="setTheme"><button data-t="auto">авто</button><button data-t="light">светлая</button><button data-t="dark">тёмная</button></div></div>
    <div class="row"><span>Шрифт</span><div class="seg" id="setBig"><button data-up="0">обычный</button><button data-up="1">+1</button><button data-up="2">+2</button><button data-up="3">+3</button><button data-up="4">+4</button><button data-up="5">+5</button></div></div>
    <div class="row"><span class="muted" id="who"></span><button class="link" id="signOut">Выйти</button></div>
  </section>
  <div id="slv"></div>
</main>

<script src="config.js"></script>
<script>
/* то же хранилище и вход, что у Экмафиси; без текстов и синхронизации — сразу main.js.
   Проверка без входа: http://127.0.0.1:8782/build/site-slovar/?dev — файлы из build/content */
Object.assign(window.EKM_CONFIG, { app: 'slovar', main: 'main.js', devContent: '../content/' });
</script>
<script src="vendor/supabase.js"></script>
<script src="slovar.js"></script>
<script src="sync.js"></script>
<script>
/* обновление по воздуху: новая оболочка встаёт — страница перезапускается сама (в словаре нечего терять) */
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').then(reg => {
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') reg.update().catch(() => {}); });
  });
  let had = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (!had) { had = true; return; } location.reload(); });
}
</script>
</body>
</html>
